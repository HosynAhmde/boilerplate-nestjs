name: pasha-crm

# Development: `make infra-up` starts only postgres and redis.
# Server:      `make deploy` (or scripts/deploy.sh) builds and starts everything
#              with the `app` profile, runs migrations and puts Caddy (HTTPS) in front.
# Monitoring:  `make monitoring-up` adds Prometheus, Grafana, Loki and exporters
#              (`monitoring` profile). See deploy/monitoring/README.md.

x-image-args: &image-args
  NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}

# Docker keeps container logs forever by default and fills the disk.
# Rotate them: at most 5 x 20MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pasha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pasha_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pasha_crm}
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432' # only reachable from the server itself
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['app']
    image: pasha-crm-api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args: *image-args
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-pasha}:${POSTGRES_PASSWORD:-pasha_dev_password}@postgres:5432/${POSTGRES_DB:-pasha_crm}
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
      OTP_DEV_LOG: 'false'
      CORS_ORIGINS: https://${DOMAIN:-localhost}
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # One-off: docker compose --profile tools run --rm migrate
  migrate:
    profiles: ['tools']
    image: pasha-crm-api:${APP_VERSION:-latest}
    env_file: .env
    environment: *api-env
    command:
      ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/database/data-source.js']
    depends_on:
      postgres: { condition: service_healthy }

  # One-off: docker compose --profile tools run --rm seed
  seed:
    profiles: ['tools']
    image: pasha-crm-api:${APP_VERSION:-latest}
    env_file: .env
    environment: *api-env
    command: ['node', 'dist/database/seeds/run-seed.js']
    depends_on:
      postgres: { condition: service_healthy }

  web:
    profiles: ['app']
    image: pasha-crm-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: *image-args
    restart: unless-stopped
    logging: *logging
    environment:
      API_INTERNAL_URL: http://api:4000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      api: { condition: service_healthy }

  # HTTPS with automatic Let's Encrypt certificates for $DOMAIN.
  caddy:
    profiles: ['app']
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

  # ---------------------------------------------------------------- monitoring
  # All UIs listen on 127.0.0.1 only; open them through an SSH tunnel:
  #   ssh -L 3001:127.0.0.1:3001 user@server   then http://localhost:3001

  prometheus:
    profiles: ['monitoring']
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  alertmanager:
    profiles: ['monitoring']
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./deploy/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager

  grafana:
    profiles: ['monitoring']
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # checked by scripts/monitoring.sh; Grafana falls back to "admin" when empty
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    profiles: ['monitoring']
    image: ${LOKI_IMAGE:-grafana/loki:3.5.3}
    restart: unless-stopped
    logging: *logging
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ./deploy/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  # Ships every container's logs of this project to Loki.
  alloy:
    profiles: ['monitoring']
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.10.0}
    restart: unless-stopped
    logging: *logging
    command: ['run', '--storage.path=/var/lib/alloy/data', '/etc/alloy/config.alloy']
    volumes:
      - ./deploy/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

  # Host CPU, memory, disk and network.
  node-exporter:
    profiles: ['monitoring']
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    restart: unless-stopped
    logging: *logging
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro

  postgres-exporter:
    profiles: ['monitoring']
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.17.1}
    restart: unless-stopped
    logging: *logging
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-pasha}:${POSTGRES_PASSWORD:-pasha_dev_password}@postgres:5432/${POSTGRES_DB:-pasha_crm}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  redis-exporter:
    profiles: ['monitoring']
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.74.0}
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  file_storage:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
