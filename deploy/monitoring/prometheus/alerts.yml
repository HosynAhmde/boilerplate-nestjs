# Alert rules. Alertmanager (alertmanager/alertmanager.yml) decides where they go.
groups:
  - name: pasha-crm
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'API در دسترس نیست'
          description: 'Prometheus برای ۲ دقیقه نتوانسته به API وصل شود.'

      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'بیش از ۵٪ درخواست‌ها خطای ۵xx دارند'
          description: 'لاگ‌های API را در Grafana (Loki) با level=error بررسی کنید.'

      - alert: ApiSlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'زمان پاسخ p95 بیش از ۲ ثانیه است'

      - alert: QueueJobsFailing
        expr: increase(queue_jobs_failed_total[15m]) > 5
        labels: { severity: warning }
        annotations:
          summary: 'کارهای صف {{ $labels.queue }} شکست می‌خورند'
          description: 'مثلاً پنل پیامک پاسخ نمی‌دهد. لاگ SmsProcessor را ببینید.'

      - alert: QueueBacklog
        expr: queue_jobs{state="waiting"} > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'صف {{ $labels.queue }} عقب افتاده است ({{ $value }} کار در انتظار)'

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'پایگاه داده PostgreSQL در دسترس نیست'

      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'بیش از ۸۰٪ اتصال‌های PostgreSQL مصرف شده'

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Redis در دسترس نیست (صف‌ها کار نمی‌کنند)'

      - alert: HostDiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'فضای دیسک {{ $labels.mountpoint }} کمتر از ۱۵٪ است'
          description: 'بکاپ‌های قدیمی و ایمیج‌های بلااستفاده (docker image prune) را پاک کنید.'

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'مصرف حافظه سرور بیش از ۹۰٪ است'

      - alert: HostHighCpu
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'مصرف CPU سرور بیش از ۹۰٪ است'
