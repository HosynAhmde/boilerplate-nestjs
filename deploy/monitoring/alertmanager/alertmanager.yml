# Where alerts are sent. By default they are only visible in the Alertmanager
# UI (http://127.0.0.1:9093) and in Grafana. Pick a receiver below, fill it in,
# set `receiver:` to its name and run `make monitoring-up` again.
route:
  receiver: none
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: none

  # ---- email (any SMTP server) ----
